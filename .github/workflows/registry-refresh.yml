name: Registry refresh

# Regenerates README.md's stream table from dars.cue joined with this repo's own
# Releases API, and opens a PR when anything changed.
#
# This is the PULL half of the design. Producer repos publish a DAR and stop;
# nothing outside this repository writes its documentation. A token that can
# push a release asset should not also be able to rewrite the registry's
# description of itself, and a new stream should cost a human paragraph rather
# than appear as a blank row.
#
# It opens a PR rather than committing to main so a new stream's first
# appearance in the public table is still reviewed.

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@v1.0.1
        with:
          # Match cue.mod/module.cue's language version. Unpinned, the action's
          # default drifts and CI starts failing on a day nobody changed anything.
          version: v0.17.1

      - name: Regenerate
        run: cue cmd generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Registry is already current."
            exit 0
          fi

          # Run id, not just the date: a manual re-run or a retry on the same day
          # would otherwise hit an existing branch and fail to push.
          BRANCH="registry/refresh-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "Refresh the generated registry table

          Regenerated by \`cue cmd generate\` from dars.cue and the Releases API."
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Refresh the generated registry table" \
            --body "Automated: \`cue cmd generate\` found the published releases and README.md's generated block out of step.

          Versions come from the Releases API; everything else from \`dars.cue\`. If a **new stream** appears here, check it was declared deliberately." \
            --base main --head "$BRANCH"
