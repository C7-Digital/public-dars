name: Registry refresh

# Regenerates README.md's stream table from dars.toml joined with
# this repo's own Releases API, and opens a PR when anything changed.
#
# This is the PULL half of the design. Producer repos publish a DAR and stop;
# nothing outside this repository writes its documentation. That is deliberate —
# a token that can push a release asset should not also be able to rewrite the
# registry's description of itself, and a new stream should cost a human
# paragraph rather than appear as a blank row.
#
# It opens a PR rather than committing to main so that a new stream's first
# appearance in the public table is still reviewed.

on:
  schedule:
    - cron: "23 7 * * *" # daily, just after registry-check
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate
        run: python3 tools/registry.py generate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open a PR if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- README.md; then
            echo "Registry is already current."
            exit 0
          fi

          BRANCH="registry/refresh-$(date -u +%Y%m%d)"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add README.md
          git commit -m "Refresh the generated registry index

          Regenerated by tools/registry.py from dars.toml and the Releases API."
          git push -u origin "$BRANCH"

          gh pr create \
            --title "Refresh the generated registry index" \
            --body "Automated: \`tools/registry.py generate\` found the published releases and the generated artifacts out of step.

          Versions come from the Releases API; everything else from \`dars.toml\`. If a **new stream** appears here, check it was declared deliberately." \
            --base main --head "$BRANCH"
