name: Registry check

# Two gates, both read-only:
#   cue vet      — dars.cue's own shape (required/unknown keys, types, kind,
#                  app and depends_on targets)
#   cue cmd check — the map against the territory: a stream published without
#                  being declared, an unparsable version tag, or a stale
#                  generated block in README.md
#
# Runs on a schedule as well as on PRs because the territory moves without us —
# a producer repo can publish a release at any time, and this is what notices.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cue-lang/setup-cue@v1.0.1

      # `-c` is load-bearing: without it CUE leaves the referential-integrity
      # checks in checks.cue unevaluated and vet passes on a manifest that
      # names an app or a dependency which does not exist.
      - name: Validate dars.cue
        run: cue vet -c schema.cue dars.cue checks.cue

      - name: Check the map against the territory
        run: cue cmd check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
